name: Boss Sports Scraper

on:
  push:
    branches: [ "main" ]
  schedule:
    # Her 30 dakikada bir otomatik çalışır
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manuel tetikleme

# Aynı anda birden fazla çalışmanın çakışmasını engelle
concurrency:
  group: scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase için tam geçmiş gerekir

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Değişiklik yoksa temiz çık
          git add matches.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, çıkılıyor."
            exit 0
          fi
          git commit -m "Auto-update channels: $(date -u)"

          # Çakışmaya karşı bağışık push döngüsü (en fazla 5 deneme)
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X ours origin/main || git rebase --abort
            if git push origin main; then
              echo "✅ Push başarılı (deneme $i)."
              exit 0
            fi
            echo "⚠️  Push reddedildi, tekrar deneniyor ($i)..."
            sleep 5
          done
          echo "❌ 5 denemede push başarısız oldu."
          exit 1
