name: Boss Sports Scraper

on:
  push:
    branches: [ "main" ]
  schedule:
    # Her 30 dakikada bir otomatik çalışır
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manuel tetikleme desteği

jobs:
  build:
    runs-on: ubuntu-latest

    # Git push işlemi için yazma izni
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Upload debug HTML (varsa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug.html
          if-no-files-found: ignore

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git pull origin main --rebase
          git add matches.json
          git commit -m "Auto-update matches: $(date)" || exit 0
          git push origin main
